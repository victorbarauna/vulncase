{% extends "base.html" %}
{% block conteudo %}
<h2>Projetos / Ativos</h2>
<p><a class="botao" href="{{ url_for('novo_projeto') }}">+ Novo projeto</a></p>
<table>
    <tr><th>Nome</th><th>Tipo</th><th>Achados</th><th>Pendentes</th><th>Ações</th></tr>
    {% for p in projetos %}
    <tr>
        <td>{{ p.nome }}</td>
        <td>{{ p.tipo }}</td>
        <td><a href="{{ url_for('achados', projeto=p.id) }}">{{ p.total }}</a></td>
        <td>{{ p.pendentes or 0 }}</td>
        <td>
            <a href="{{ url_for('relatorio', id=p.id) }}">Relatório</a> |
            <a href="{{ url_for('exportar_csv', id=p.id) }}">CSV</a> |
            <a href="{{ url_for('editar_projeto', id=p.id) }}">Editar</a>
            <form method="post" action="{{ url_for('excluir_projeto', id=p.id) }}" class="inline">
                <input type="hidden" name="csrf" value="{{ csrf_token() }}">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    {% else %}
    <tr><td colspan="5">Nenhum projeto cadastrado.</td></tr>
    {% endfor %}
</table>
{% endblock %}
