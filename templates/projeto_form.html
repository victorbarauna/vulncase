{% extends "base.html" %}
{% block conteudo %}
<h2>{{ 'Editar' if projeto else 'Novo' }} projeto</h2>
<form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Nome <input type="text" name="nome" value="{{ projeto.nome if projeto else '' }}" required></label>
    <label>Tipo
        <select name="tipo">
            {% for t in tipos %}
            <option {% if projeto and projeto.tipo == t %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Descrição <textarea name="descricao">{{ projeto.descricao if projeto else '' }}</textarea></label>
    <button type="submit">Salvar</button>
    <a href="{{ url_for('projetos') }}">Cancelar</a>
</form>
{% endblock %}
